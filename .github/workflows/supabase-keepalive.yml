name: Supabase Keep Alive

on:
  schedule:
    - cron: '0 2 */5 * *'  # ทุก 5 วัน เวลา 02:00 UTC (09:00 น. ไทย)
  workflow_dispatch:        # กด run เองได้จาก GitHub Actions UI

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping Supabase
        run: |
          STATUS=$(curl -s -o /dev/null -w "%{http_code}" \
            -H "apikey: ${{ secrets.SUPABASE_ANON_KEY }}" \
            -H "Authorization: Bearer ${{ secrets.SUPABASE_ANON_KEY }}" \
            "https://rcfbricvpkkjbclesqjf.supabase.co/rest/v1/")

          echo "HTTP Status: $STATUS"

          if [ "$STATUS" -ge 200 ] && [ "$STATUS" -lt 500 ]; then
            echo "Supabase is alive"
          else
            echo "Ping failed with status $STATUS"
            exit 1
          fi
